name: Build and Push Docker Image

on:
  push:
    branches: [main]
    # Image builds from upstream source; deployment-file-only changes skip the
    # rebuild. Run manually (workflow_dispatch) for a fresh upstream build.
    paths-ignore:
      - 'docker-compose.yaml'
      - 'README.md'
      - '.env.example'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Build from the upstream source; this repo only holds deployment files.
      - name: Checkout upstream OpenSEO source
        uses: actions/checkout@v7
        with:

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.selfhost
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openseo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/openseo:${{ github.sha }}