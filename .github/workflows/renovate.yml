name: Renovate

# Self-hosted Renovate. The Mend-hosted Renovate app does not see this repository,
# so Renovate runs here instead: same tool, same config file, no third-party app.
#
# Runs daily and on demand. Renovate opens a PR per dependency; nothing merges
# automatically (automerge is false in renovate.json), and majors are held for a
# human to read the release notes.

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate config
        run: npx --yes --package renovate@44.237.0 -- renovate-config-validator --strict

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: renovate.json
          token: ${{ secrets.GH_PAT }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "optional"
          LOG_LEVEL: info