name: Upstream Sync

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even if the latest tag is < 24h old"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/every-app/open-seo.git 2>/dev/null || \
            git remote set-url upstream https://github.com/every-app/open-seo.git
          git fetch upstream --tags

      - name: Find latest upstream tag
        id: tag
        run: |
          set -euo pipefail
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$TAG" ]; then
            echo "No upstream v* tags found"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: $TAG"

      - name: Sync (merge + reconcile + commit)
        id: sync
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"

          if git merge-base --is-ancestor "$TAG" HEAD; then
            echo "do_sync=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already an ancestor of main - nothing to do."
            exit 0
          fi

          tag_date=$(git log -1 --format=%ct "$TAG" 2>/dev/null || echo 0)
          now=$(date +%s)
          age=$((now - tag_date))
          echo "Tag $TAG age: $((age/3600))h"
          if [ "$FORCE" != "true" ] && [ "$age" -lt 86400 ]; then
            echo "do_sync=false" >> "$GITHUB_OUTPUT"
            echo "Tag is < 24h old - soaking. Re-run with force=true to override."
            exit 0
          fi

          merge_failed=0
          git merge --no-ff --no-commit "$TAG" || merge_failed=1

          if [ "$merge_failed" = "1" ]; then
            git diff --name-only --diff-filter=U | grep '^\.github/workflows/' | while read -r f; do
              git rm -f -- "$f"
            done
            remaining=$(git diff --name-only --diff-filter=U)
            if [ -n "$remaining" ]; then
              echo "Real (non-workflow) conflicts remain:"
              echo "$remaining"
              git merge --abort
              exit 1
            fi
          fi

          if [ -x .fork/sync-upstream-workflows.sh ]; then
            bash .fork/sync-upstream-workflows.sh
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit after merge."
            echo "do_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: merge upstream $TAG"
          echo "do_sync=true" >> "$GITHUB_OUTPUT"
          echo "Merged $TAG successfully."

      - name: Push
        if: steps.sync.outputs.do_sync == 'true'
        run: git push origin main
