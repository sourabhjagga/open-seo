name: Security scan

# Two free, self-hosted scanners, run in the checkout:
#   gitleaks  - secrets in the working tree; fails the job so a secret cannot be
#               merged (it scans the files, not the history, so old commits that
#               were already cleaned do not keep the job red)
#   Trivy     - vulnerable dependencies and IaC misconfiguration; reports only,
#               because most findings have no immediate fix and failing on them
#               would make the job noise
#
# Dependabot alerts are a separate, repository-level setting: they watch
# dependencies over time, this workflow looks at one checkout.

on:
  pull_request:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --redact --verbose --exit-code 1

  trivy:
    name: Dependencies and IaC (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          format: table