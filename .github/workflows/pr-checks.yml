name: pr checks

# The gate Renovate and Dependabot pull requests go through before anything can
# merge. Before this existed nothing ran on a pull request, so a dependency bump
# that broke the build was only discovered after it reached main.
#
# Deliberately light: install with the repo's own lockfile, then lint. A full
# build needs production environment variables that a pull request does not have,
# so it would fail for reasons that have nothing to do with the change. The
# deploy pipeline still builds and health-checks after the merge, and rolls back
# if the app does not come up.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Install and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Find package manifests
        id: find
        run: |
          set -euo pipefail
          # Root manifest first, then one level down (monorepos such as
          # latest-gpu-vista keep their packages in api/ and frontend/).
          roots=()
          if [ -f package.json ]; then roots+=("."); else
            while IFS= read -r d; do roots+=("$d"); done < <(find . -maxdepth 2 -name package.json -not -path "*/node_modules/*" -printf '%h\n' | sort)
          fi
          echo "roots<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${roots[@]}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ "${#roots[@]}" -eq 0 ]; then echo "none=true" >> "$GITHUB_OUTPUT"; else echo "none=false" >> "$GITHUB_OUTPUT"; fi
          printf 'found: %s\n' "${roots[*]:-none}"

      - name: Set up Node
        if: steps.find.outputs.none == 'false'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install and lint
        if: steps.find.outputs.none == 'false'
        env:
          ROOTS: ${{ steps.find.outputs.roots }}
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "::group::$dir"
            cd "$GITHUB_WORKSPACE/$dir"
            if [ -f bun.lock ] || [ -f bun.lockb ]; then
              if ! command -v bun >/dev/null 2>&1; then
                echo "installing bun"
                curl -fsSL https://bun.sh/install | bash >/dev/null 2>&1 || true
                export PATH="$HOME/.bun/bin:$PATH"
              fi
              bun install --frozen-lockfile || { echo "::error::bun install failed in $dir"; status=1; cd "$GITHUB_WORKSPACE"; continue; }
              bun run lint --if-present || echo "::warning::lint not defined in $dir"
            elif [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund || { echo "::error::npm ci failed in $dir"; status=1; cd "$GITHUB_WORKSPACE"; continue; }
              npm run lint --if-present || echo "::warning::lint not defined in $dir"
            elif [ -f pnpm-lock.yaml ]; then
              corepack enable >/dev/null 2>&1 || true
              pnpm install --frozen-lockfile || { echo "::error::pnpm install failed in $dir"; status=1; cd "$GITHUB_WORKSPACE"; continue; }
              pnpm run lint --if-present || echo "::warning::lint not defined in $dir"
            else
              echo "no lockfile in $dir, skipping"
            fi
            echo "::endgroup::"
            cd "$GITHUB_WORKSPACE"
          done <<< "$ROOTS"
          exit "$status"

      - name: Validate compose file
        run: |
          set -euo pipefail
          # Parse the YAML rather than running "docker compose config": that
          # command insists on every env_file the compose names and on every
          # ${VAR:?} being set, which a pull request checkout never has.
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.run([sys.executable, "-m", "pip", "install", "--quiet", "pyyaml"], check=True)
              import yaml
          found = False
          for name in ("docker-compose.yaml", "docker-compose.yml"):
              try:
                  with open(name) as fh:
                      list(yaml.safe_load_all(fh))
              except FileNotFoundError:
                  continue
              found = True
              print(f"{name} parses")
          if not found:
              print("no compose file, nothing to validate")
          PY